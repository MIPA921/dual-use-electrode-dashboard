<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dual-use electrode system designer</title>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.10.3/Recharts.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #0b0d12; }
  #root { max-width: 1100px; margin: 0 auto; padding: 20px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useMemo, useState, useEffect, useRef } = React;
const { LineChart, Line, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Cell } = Recharts;


// ---------- Real computed electrical model ----------
function randlesImpedance(freqArr, Rs, Rct, Cdl) {
  return freqArr.map((f) => {
    const omega = 2 * Math.PI * f;
    const zcIm = -1 / (omega * Cdl);
    const numIm = Rct * zcIm;
    const denRe = Rct, denIm = zcIm;
    const denMagSq = denRe * denRe + denIm * denIm;
    const zpRe = (numIm * denIm) / denMagSq;
    const zpIm = (numIm * denRe) / denMagSq;
    const re = Rs + zpRe, im = zpIm;
    return { f, mag: Math.sqrt(re * re + im * im) };
  });
}
const FREQS = (() => {
  const arr = [];
  for (let i = 0; i <= 60; i++) arr.push(Math.pow(10, (i / 60) * 5));
  return arr;
})();
function paramsFromQuality(q, channelDensity) {
  const t = q / 100;
  const baseRs = 800 - t * 600;
  const baseRct = 90000 - t * 85000;
  const baseCdl = Math.pow(10, -9.5 + t * 2);
  // Higher channel density -> smaller per-site contact area -> higher Rct, lower Cdl.
  // Normalized around 128 channels (no change at 128; denser arrays scale impedance up).
  const densityFactor = channelDensity / 128;
  return { Rs: baseRs, Rct: baseRct * densityFactor, Cdl: baseCdl / densityFactor };
}
function fixedSnrDb(z1k) {
  // fixed reference SNR (8-bit ADC equivalent) penalized by impedance vs a 10k ohm reference
  const quantSnr = 6.02 * 8 + 1.76;
  const penalty = -10 * Math.log10(z1k / 10000);
  return quantSnr + penalty;
}

// ---------- Rule-based tables (each rating traces to a stated engineering fact) ----------
const DECODERS = {
  kalman: { label: "Kalman filter", robustness: 2, realtime: 5,
    note: "Linear, stationary-signal assumption; fast but degrades as neural statistics drift." },
  rnn: { label: "Adaptive RNN", robustness: 4, realtime: 3,
    note: "Learns nonlinear patterns, adapts online to nonstationary signals; moderate compute cost." },
  transformer: { label: "Transformer", robustness: 5, realtime: 2,
    note: "Best long-range pattern capture; highest compute/power cost for an implant." },
};
const MATERIALS = {
  silicon: { label: "Silicon", flexibility: 2, biocompat: 3, longevity: 3,
    note: "Rigid (~150 GPa modulus) relative to brain tissue; mature fabrication, well characterized." },
  polyimide: { label: "Polyimide", flexibility: 5, biocompat: 5, longevity: 4,
    note: "Low modulus close to brain tissue stiffness; literature links this to reduced chronic glial scarring." },
  graphene: { label: "Graphene", flexibility: 4, biocompat: 3, longevity: 2,
    note: "Excellent conductivity and flexibility; long-term implant biocompatibility data still limited." },
};

// Grounded directly in the therapy comparison table from the presentation slides
// (NIMH 2026 source cited on-slide). Specificity/invasiveness are the slide's own
// table values; side-effect framing follows the slide's own note that non-invasive
// methods carry fewer side effects than invasive ones.
const THERAPIES = {
  none: { label: "None — communication only", isImplant: false },
  ect: { label: "Electroconvulsive therapy (ECT)", invasive: false, specificity: "General", specificityStars: 2,
    isImplant: false, sideEffectStars: 4,
    note: "Non-invasive; electrodes at scalp induce brief general seizure activity (<1 min). NIMH 2026." },
  rtms: { label: "Repetitive TMS (rTMS)", invasive: false, specificity: "Targeted", specificityStars: 3,
    isImplant: false, sideEffectStars: 4,
    note: "Non-invasive repeated magnetic pulses; cited among the lower-side-effect options. NIMH 2026." },
  vns: { label: "Vagus nerve stimulation (VNS)", invasive: true, specificity: "Targeted", specificityStars: 3,
    isImplant: true, sideEffectStars: 2,
    note: "Implanted device sends pulses through the vagus nerve (chest to brainstem). NIMH 2026." },
  mst: { label: "Magnetic seizure therapy (MST)", invasive: false, specificity: "Targeted", specificityStars: 3,
    isImplant: false, sideEffectStars: 4,
    note: "Non-invasive; higher-intensity/frequency magnetic pulses than rTMS. NIMH 2026." },
  dbs: { label: "Deep brain stimulation (DBS)", invasive: true, specificity: "Very targeted", specificityStars: 5,
    isImplant: true, sideEffectStars: 2, controlStars: 5, reversibilityStars: 5, persistenceYears: "~10",
    note: "Implanted electrodes + generator; 24/7 adjustable control, ~10yr persistence of benefit, reversible (battery removal), FDA approved. Milelr 2019; NINDS 2026." },
};

function Stars({ n, max = 5 }) {
  return (
    <span style={{ letterSpacing: 1 }}>
      {Array.from({ length: max }).map((_, i) => (
        <span key={i} style={{ color: i < n ? "#e8c95a" : "#3a3d47" }}>★</span>
      ))}
    </span>
  );
}

function ElectrodeDashboardV3() {
  const [recordingType, setRecordingType] = useState("extracellular");
  const [channelDensity, setChannelDensity] = useState(128);
  const [quality, setQuality] = useState(60);
  const [decoder, setDecoder] = useState("rnn");
  const [material, setMaterial] = useState("polyimide");
  const [therapy, setTherapy] = useState("dbs");
  const repairMode = therapy !== "none";
  const th = THERAPIES[therapy];

  const [step, setStep] = useState(-1); // animated pipeline reveal, -1 = not evaluated yet
  const timerRef = useRef(null);

  const { Rs, Rct, Cdl } = paramsFromQuality(quality, channelDensity);
  const impedanceCurve = useMemo(() => randlesImpedance(FREQS, Rs, Rct, Cdl), [Rs, Rct, Cdl]);
  const z1k = useMemo(() => randlesImpedance([1000], Rs, Rct, Cdl)[0].mag, [Rs, Rct, Cdl]);
  const snr = fixedSnrDb(z1k);

  const dec = DECODERS[decoder];
  const mat = MATERIALS[material];

  // Recording fidelity stars from real computed SNR (thresholds are the stated rule)
  const fidelityStars = snr > 55 ? 5 : snr > 45 ? 4 : snr > 35 ? 3 : snr > 25 ? 2 : 1;
  const robustnessStars = dec.robustness;
  const realtimeStars = dec.realtime;
  const materialApplies = repairMode && th.isImplant; // material/electrode panel only matters for implants
  const stimCompatStars = materialApplies ? Math.min(5, mat.biocompat) : null;
  const materialStars = materialApplies ? mat.biocompat : null;
  const longevityStars = materialApplies ? mat.longevity : null;
  const specificityStars = repairMode ? th.specificityStars : null;
  const sideEffectStars = repairMode ? th.sideEffectStars : null;

  const commAvg = (fidelityStars + robustnessStars + realtimeStars) / 3;
  const repairStarsList = repairMode
    ? [specificityStars, sideEffectStars, ...(materialApplies ? [stimCompatStars, materialStars, longevityStars] : [])]
    : [];
  const repairAvg = repairStarsList.length ? repairStarsList.reduce((a, b) => a + b, 0) / repairStarsList.length : 0;
  const overallOk = commAvg >= 3 && (!repairMode || repairAvg >= 3);
  const recommendation = repairMode
    ? (overallOk ? `Meets criteria for dual-use communication and ${th.label.split(" (")[0]}`
                 : "Communication and/or repair criteria not yet met — revise design")
    : (commAvg >= 3 ? "Meets criteria for brain-device communication (no repair therapy selected)"
                     : "Communication criteria not yet met — revise design");

  const steps = ["Brain", "Electrode array", "Neural signal", dec.label, "Assessment"];

  function runEvaluation() {
    clearInterval(timerRef.current);
    setStep(0);
    let i = 0;
    timerRef.current = setInterval(() => {
      i += 1;
      setStep(i);
      if (i >= steps.length - 1) clearInterval(timerRef.current);
    }, 450);
  }
  useEffect(() => () => clearInterval(timerRef.current), []);

  const chartData = impedanceCurve.map((d) => ({ freq: d.f, impedance: Math.round(d.mag) }));

  // Composite metrics bar chart — every bar here reacts to at least one design control
  // (recording type via SNR, channel density via impedance, decoder, material, therapy).
  const metricsData = [
    { name: "Recording fidelity", value: fidelityStars, color: "#6ea8fe" },
    { name: "Decoder robustness", value: robustnessStars, color: "#6ea8fe" },
    { name: "Real-time capability", value: realtimeStars, color: "#6ea8fe" },
    ...(repairMode ? [
      { name: "Targeting specificity", value: specificityStars, color: "#5fd08b" },
      { name: "Side-effect profile", value: sideEffectStars, color: "#5fd08b" },
      ...(materialApplies ? [
        { name: "Stimulation compat.", value: stimCompatStars, color: "#5fd08b" },
        { name: "Material suitability", value: materialStars, color: "#5fd08b" },
        { name: "Long-term implant.", value: longevityStars, color: "#5fd08b" },
      ] : []),
    ] : []),
  ];

  return (
    <div style={{ background: "#0b0d12", color: "#e6e8ec", fontFamily: "ui-sans-serif, system-ui, sans-serif",
      padding: 24, borderRadius: 12, minHeight: 600 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
        <div>
          <div style={{ fontSize: 20, fontWeight: 600 }}>Dual-use electrode system designer</div>
          <div style={{ fontSize: 13, color: "#9aa1ad", marginTop: 4 }}>
            Does this design satisfy dual-use requirements?
          </div>
        </div>
        <button onClick={runEvaluation} style={{
          background: "#4c5bd4", color: "#fff", border: "none", borderRadius: 8,
          padding: "10px 18px", fontSize: 13, fontWeight: 600, cursor: "pointer",
        }}>Evaluate design</button>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1.1fr 1.1fr", gap: 16 }}>

        {/* PANEL 1: DESIGN CONTROLS */}
        <div style={panelStyle}>
          <PanelHeader n={1} title="Design controls" />

          <SectionLabel color="#6ea8fe">Electrical</SectionLabel>
          <ToggleGroup value={recordingType} onChange={setRecordingType}
            options={[{ v: "extracellular", l: "Extracellular" }, { v: "intracellular", l: "Intracellular" }]} />
          <Slider label="Channel density" value={channelDensity} min={16} max={512} step={16} unit="ch" onChange={setChannelDensity} />
          <Slider label="Signal quality target" value={quality} min={0} max={100} step={5} unit="%" onChange={setQuality} />

          <SectionLabel color="#c48ce8">Computational</SectionLabel>
          <SelectGroup value={decoder} onChange={setDecoder}
            options={Object.entries(DECODERS).map(([k, v]) => ({ v: k, l: v.label }))} />
          <div style={{ fontSize: 11, color: "#6f7684", marginTop: -6, marginBottom: 4 }}>{dec.note}</div>

          <SectionLabel color="#e8a95a">Materials</SectionLabel>
          <SelectGroup value={material} onChange={setMaterial}
            options={Object.entries(MATERIALS).map(([k, v]) => ({ v: k, l: v.label }))} />
          <div style={{ display: "grid", gap: 4, fontSize: 12, marginTop: 6 }}>
            <div style={{ display: "flex", justifyContent: "space-between" }}><span>Flexibility</span><Stars n={mat.flexibility} /></div>
            <div style={{ display: "flex", justifyContent: "space-between" }}><span>Biocompatibility</span><Stars n={mat.biocompat} /></div>
            <div style={{ display: "flex", justifyContent: "space-between" }}><span>Longevity</span><Stars n={mat.longevity} /></div>
          </div>
          <div style={{ fontSize: 11, color: "#6f7684", marginTop: 6 }}>{mat.note}</div>

          <SectionLabel color="#5fd08b">Biomedical</SectionLabel>
          <SelectGroup value={therapy} onChange={setTherapy}
            options={Object.entries(THERAPIES).map(([k, v]) => ({ v: k, l: v.label }))} />
          {repairMode && (
            <>
              <div style={{ display: "flex", gap: 8, fontSize: 11.5, margin: "6px 0" }}>
                <span style={{ padding: "2px 8px", borderRadius: 10,
                  background: th.invasive ? "#2a1a1a" : "#152318",
                  color: th.invasive ? "#f0776b" : "#5fd08b" }}>{th.invasive ? "Invasive" : "Non-invasive"}</span>
                <span style={{ padding: "2px 8px", borderRadius: 10, background: "#171a23", color: "#c7cbd3" }}>
                  Specificity: {th.specificity}
                </span>
              </div>
              <div style={{ fontSize: 11, color: "#6f7684", marginBottom: 6 }}>{th.note}</div>
              {th.isImplant
                ? <div style={{ fontSize: 11, color: "#8fb4ff" }}>Implanted electrode — materials panel above applies.</div>
                : <div style={{ fontSize: 11, color: "#e8a95a" }}>Non-implanted therapy — electrode materials panel above doesn't apply here.</div>}
              {therapy === "dbs" && (
                <div style={{ display: "grid", gap: 4, fontSize: 12, marginTop: 8 }}>
                  <div style={{ display: "flex", justifyContent: "space-between" }}><span>Adjustable control</span><Stars n={th.controlStars} /></div>
                  <div style={{ display: "flex", justifyContent: "space-between" }}><span>Reversibility</span><Stars n={th.reversibilityStars} /></div>
                  <div style={{ display: "flex", justifyContent: "space-between" }}><span>Persistence of benefit</span><span style={{ color: "#c7cbd3" }}>{th.persistenceYears} yrs</span></div>
                </div>
              )}
            </>
          )}
        </div>

        {/* PANEL 2: SIMULATION / PIPELINE */}
        <div style={panelStyle}>
          <PanelHeader n={2} title="System pipeline" />
          <div style={{ display: "flex", alignItems: "center", gap: 4, marginBottom: 18, flexWrap: "wrap" }}>
            {steps.map((s, i) => (
              <React.Fragment key={s}>
                <div style={{
                  fontSize: 11, borderRadius: 6, padding: "7px 9px", transition: "all .3s",
                  background: step >= i ? "#1c2440" : "#171a23",
                  border: step >= i ? "1px solid #4c5bd4" : "1px solid #2a2f3d",
                  color: step >= i ? "#a9bcff" : "#7d8697",
                }}>{s}</div>
                {i < steps.length - 1 && <span style={{ color: step > i ? "#4c5bd4" : "#2a2f3d", fontSize: 13 }}>&rarr;</span>}
              </React.Fragment>
            ))}
          </div>

          {step >= steps.length - 1 && (
            <div style={{
              background: overallOk ? "#122318" : "#241717", border: `1px solid ${overallOk ? "#2e5c3e" : "#5c3030"}`,
              borderRadius: 8, padding: 12, marginBottom: 16, fontSize: 13, color: overallOk ? "#8fe0a8" : "#f0776b",
            }}>{recommendation}</div>
          )}

          <SectionLabel color="#e8a95a">Design performance (all controls)</SectionLabel>
          <div style={{ height: 210, marginTop: 4 }}>
            <ResponsiveContainer>
              <BarChart data={metricsData} layout="vertical" margin={{ left: 10, right: 10 }}>
                <CartesianGrid stroke="#1c2029" strokeDasharray="3 3" horizontal={false} />
                <XAxis type="number" domain={[0, 5]} tick={{ fill: "#8b93a1", fontSize: 10 }} />
                <YAxis type="category" dataKey="name" width={120} tick={{ fill: "#c7cbd3", fontSize: 11 }} />
                <Tooltip contentStyle={{ background: "#151822", border: "1px solid #2a2f3d", fontSize: 12 }}
                  formatter={(v) => [`${v} / 5`, "Rating"]} />
                <Bar dataKey="value" radius={[0, 4, 4, 0]}>
                  {metricsData.map((d, i) => <Cell key={i} fill={d.color} />)}
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>
          <div style={{ fontSize: 11, color: "#6f7684", marginBottom: 4 }}>
            Blue = communication metrics, green = repair metrics. Updates with every control in panel 1.
          </div>

          <SectionLabel color="#6ea8fe">Recording detail (computed)</SectionLabel>
          <div style={{ height: 130 }}>
            <ResponsiveContainer>
              <LineChart data={chartData}>
                <CartesianGrid stroke="#1c2029" strokeDasharray="3 3" />
                <XAxis dataKey="freq" scale="log" domain={["auto", "auto"]} tick={{ fill: "#6f7684", fontSize: 10 }}
                  tickFormatter={(v) => v >= 1000 ? `${v / 1000}k` : v} />
                <YAxis scale="log" domain={["auto", "auto"]} tick={{ fill: "#6f7684", fontSize: 10 }} width={45} />
                <Tooltip contentStyle={{ background: "#151822", border: "1px solid #2a2f3d", fontSize: 11 }}
                  formatter={(v) => [`${v} Ω`, "Impedance"]} labelFormatter={(l) => `${Math.round(l)} Hz`} />
                <Line type="monotone" dataKey="impedance" stroke="#3d4a7a" dot={false} strokeWidth={1.5} />
              </LineChart>
            </ResponsiveContainer>
          </div>
          <div style={{ fontSize: 11, color: "#6f7684" }}>Effective SNR (computed): {snr.toFixed(1)} dB &middot; impedance @1kHz: {Math.round(z1k).toLocaleString()} Ω</div>
        </div>

        {/* PANEL 3: ASSESSMENT */}
        <div style={panelStyle}>
          <PanelHeader n={3} title="Requirement assessment" />

          <SectionLabel color="#6ea8fe">Brain-device communication</SectionLabel>
          <StarRow label="Recording fidelity" n={fidelityStars} />
          <StarRow label="Decoder robustness" n={robustnessStars} />
          <StarRow label="Real-time capability" n={realtimeStars} />

          {repairMode && (
            <>
              <SectionLabel color="#5fd08b">Neural repair — {th.label.split(" (")[0]}</SectionLabel>
              <StarRow label="Targeting specificity" n={specificityStars} />
              <StarRow label="Side-effect profile" n={sideEffectStars} />
              {materialApplies ? (
                <>
                  <StarRow label="Stimulation compatibility" n={stimCompatStars} />
                  <StarRow label="Material suitability" n={materialStars} />
                  <StarRow label="Long-term implantation" n={longevityStars} />
                </>
              ) : (
                <div style={{ fontSize: 11, color: "#6f7684", padding: "4px 0" }}>
                  Non-implanted therapy — electrode material ratings not applicable.
                </div>
              )}
            </>
          )}

          <SectionLabel color="#e8a95a">Overall</SectionLabel>
          <div style={{
            fontSize: 13, fontWeight: 600, marginTop: 4,
            color: overallOk ? "#8fe0a8" : "#f0776b",
          }}>{recommendation}</div>

          <div style={{ fontSize: 11, color: "#6f7684", marginTop: 14, lineHeight: 1.6 }}>
            Star ratings are rule-based on the cited tradeoffs shown next to each control —
            not output from a trained decoder or materials simulation. SNR and impedance values
            are computed from the electrode circuit model.
          </div>
        </div>
      </div>
    </div>
  );
}

const panelStyle = { background: "#12151c", border: "1px solid #232733", borderRadius: 10, padding: 16 };
function PanelHeader({ n, title }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
      <div style={{ width: 20, height: 20, borderRadius: "50%", background: "#4c5bd4",
        display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 600 }}>{n}</div>
      <div style={{ fontSize: 13, fontWeight: 600, letterSpacing: 0.4, color: "#dfe2e8", textTransform: "uppercase" }}>{title}</div>
    </div>
  );
}
function SectionLabel({ children, color }) {
  return (
    <div style={{ fontSize: 11, fontWeight: 600, color: color || "#7d8697", letterSpacing: 0.5,
      marginTop: 16, marginBottom: 8, borderTop: "1px solid #1e222c", paddingTop: 12,
      textTransform: "uppercase" }}>
      {children}
    </div>
  );
}
function Slider({ label, value, min, max, step, unit, onChange }) {
  return (
    <div style={{ marginBottom: 12 }}>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, color: "#c7cbd3", marginBottom: 4 }}>
        <span>{label}</span><span style={{ color: "#8fb4ff" }}>{value} {unit}</span>
      </div>
      <input type="range" min={min} max={max} step={step} value={value}
        onChange={(e) => onChange(parseFloat(e.target.value))} style={{ width: "100%", accentColor: "#4c5bd4" }} />
    </div>
  );
}
function ToggleGroup({ value, onChange, options }) {
  return (
    <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
      {options.map((o) => (
        <button key={o.v} onClick={() => onChange(o.v)} style={{
          flex: 1, padding: "6px 8px", fontSize: 12, borderRadius: 6, cursor: "pointer",
          border: value === o.v ? "1px solid #4c5bd4" : "1px solid #2a2f3d",
          background: value === o.v ? "#1c2440" : "transparent",
          color: value === o.v ? "#a9bcff" : "#9aa1ad",
        }}>{o.l}</button>
      ))}
    </div>
  );
}
function SelectGroup({ value, onChange, options }) {
  return (
    <select value={value} onChange={(e) => onChange(e.target.value)} style={{
      width: "100%", padding: "6px 8px", fontSize: 12.5, marginBottom: 4, borderRadius: 6,
      background: "#171a23", color: "#e6e8ec", border: "1px solid #2a2f3d",
    }}>{options.map((o) => <option key={o.v} value={o.v}>{o.l}</option>)}</select>
  );
}
function StarRow({ label, n }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 12.5, padding: "5px 0" }}>
      <span style={{ color: "#c7cbd3" }}>{label}</span>
      <Stars n={n} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ElectrodeDashboardV3 />);
</script>
</body>
</html>
